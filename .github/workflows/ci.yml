name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Lets release.yml run this exact gate on the tagged commit before publishing,
  # so the release gate cannot drift from the pull-request gate.
  workflow_call:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Formatting and code style, the way ruff gates a Python repo. Analyzers already run inside the build
  # with warnings as errors; this catches whitespace and style rules that the compiler does not.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore

      - name: Verify formatting and style
        run: dotnet format Aelena.CommonExtensions.slnx --verify-no-changes --no-restore --verbosity diagnostic

  # Dependency vulnerability audit over direct and transitive packages, the way OWASP Dependency Check
  # gates a pipeline. Restore also audits (NuGetAuditMode=all) and fails on moderate or worse.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Audit dependencies
        shell: pwsh
        run: ./scripts/audit.ps1

  build-test-cover:
    # Windows so the net48 test target runs and exercises the netstandard2.0 build.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET SDKs and runtimes
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test with 100% coverage gate
        shell: pwsh
        run: ./scripts/coverage.ps1

      - name: Publish coverage summary
        if: always()
        shell: bash
        run: cat TestResults/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: TestResults/report

      - name: Pack
        run: dotnet pack src/Aelena.CommonExtensions/Aelena.CommonExtensions.csproj --no-build -c Release -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/*.*nupkg
