name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Lets release.yml run this exact gate on the tagged commit before publishing,
  # so the release gate cannot drift from the pull-request gate.
  workflow_call:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-cover:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET SDKs and runtimes
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test with 100% coverage gate
        shell: pwsh
        run: ./scripts/coverage.ps1

      - name: Publish coverage summary
        if: always()
        shell: bash
        run: cat TestResults/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: TestResults/report

      - name: Pack
        run: dotnet pack src/Aelena.Extensions/Aelena.Extensions.csproj --no-build -c Release -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/*.*nupkg
